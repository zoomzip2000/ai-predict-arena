name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy-webapp:
    name: Deploy aipa-webapp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aipa-webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aipa-webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=ai-predict-arena --commit-dirty=true
          workingDirectory: aipa-webapp

  deploy-admin:
    name: Deploy aipa-admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aipa-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aipa-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=aipa-admin --commit-dirty=true
          workingDirectory: aipa-admin

  deploy-tapbot:
    name: Deploy aipa-tapbot-front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aipa-tapbot-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aipa-tapbot-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=aipa-tapbot --commit-dirty=true
          workingDirectory: aipa-tapbot-front
